services:
  postgres:
    image: docker.io/library/postgres:17-alpine
    container_name: sis-postgres
    environment:
      POSTGRES_DB: sis
      POSTGRES_USER: sis
      POSTGRES_PASSWORD: sis_dev_only
    ports:
      - "5432:5432"
    volumes:
      - sis_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sis -d sis"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  sis_pgdata:
