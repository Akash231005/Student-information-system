[project]
name = "sis-scalability-lab"
version = "0.1.0"
description = "Correctness-first Student Information System prototype for system design experiments"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "sqlalchemy>=2.0,<3.0",
  "psycopg[binary]>=3.2,<4.0",
  "pydantic-settings>=2.5,<3.0",
  "alembic>=1.14,<2.0",
  "redis>=5.0,<7.0",
  "pymongo>=4.9,<5.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0", "httpx>=0.27"]
benchmark = ["locust>=2.32,<3.0"]
dev = ["ruff>=0.9,<1.0"]
deliverables = ["python-pptx>=1.0,<2.0", "reportlab>=4.2,<5.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
lint.ignore = ["B008"]
