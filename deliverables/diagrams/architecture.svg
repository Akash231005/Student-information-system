<?xml version="1.0" encoding="UTF-8"?>
<!--
  ORBIT SIS runtime architecture. Hand-authored figure: edit this file directly.
  Derived copies are regenerated with build.sh (Inkscape PNG + PDF), which also
  rewrites architecture.png. Every node below is a thing that actually runs (see
  sis-app/scripts/start_stack.sh); no in-process stand-ins are drawn because the
  code no longer has any.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1460" height="1020" viewBox="0 0 1460 1020"
     font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif">

  <defs>
    <filter id="sh" x="-12%" y="-12%" width="124%" height="130%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2.2"/>
      <feOffset dx="0" dy="1.5" result="off"/>
      <feFlood flood-color="#0F172A" flood-opacity="0.09"/>
      <feComposite in2="off" operator="in"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="ar-slate" markerWidth="7" markerHeight="7" refX="6.4" refY="3.5" orient="auto">
      <path d="M0,1 L6.4,3.5 L0,6 Z" fill="#94A3B8"/>
    </marker>
    <marker id="ar-rose" markerWidth="7" markerHeight="7" refX="6.4" refY="3.5" orient="auto">
      <path d="M0,1 L6.4,3.5 L0,6 Z" fill="#F43F5E"/>
    </marker>
    <marker id="ar-indigo" markerWidth="7" markerHeight="7" refX="6.4" refY="3.5" orient="auto">
      <path d="M0,1 L6.4,3.5 L0,6 Z" fill="#4F46E5"/>
    </marker>
    <marker id="ar-amber" markerWidth="7" markerHeight="7" refX="6.4" refY="3.5" orient="auto">
      <path d="M0,1 L6.4,3.5 L0,6 Z" fill="#B45309"/>
    </marker>
  </defs>

  <rect width="1460" height="1020" fill="#FFFFFF"/>

  <!-- header -->
  <text x="44" y="58" font-size="26" font-weight="700" fill="#0F172A">ORBIT SIS &#183; RUNTIME ARCHITECTURE</text>
  <text x="44" y="84" font-size="13" fill="#64748B">real Redis and MongoDB behind two app workers &#8212; no in-memory fallback</text>

  <!-- ============ CLIENTS ============ -->
  <rect x="40" y="120" width="250" height="250" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.2"/>
  <text x="58" y="146" font-size="10.5" font-weight="700" fill="#64748B" letter-spacing="1.4">CLIENTS</text>

  <g filter="url(#sh)">
    <rect x="58" y="164" width="214" height="74" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
    <text x="74" y="190" font-size="13.5" font-weight="600" fill="#0F172A">Student / faculty</text>
    <text x="74" y="209" font-size="10.5" fill="#64748B">browser &#183; HTTPS</text>
  </g>
  <g filter="url(#sh)">
    <rect x="58" y="254" width="214" height="74" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
    <text x="74" y="280" font-size="13.5" font-weight="600" fill="#0F172A">Locust</text>
    <text x="74" y="299" font-size="10.5" fill="#64748B">concurrent workloads</text>
  </g>

  <!-- ============ LEGEND ============ -->
  <rect x="40" y="400" width="250" height="150" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.2"/>
  <text x="58" y="426" font-size="10.5" font-weight="700" fill="#64748B" letter-spacing="1.4">LEGEND</text>
  <line x1="58" y1="450" x2="94" y2="450" stroke="#94A3B8" stroke-width="1.4" marker-end="url(#ar-slate)"/>
  <text x="104" y="454" font-size="10.5" fill="#475569">request path</text>
  <line x1="58" y1="478" x2="94" y2="478" stroke="#94A3B8" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#ar-slate)"/>
  <text x="104" y="482" font-size="10.5" fill="#475569">experimental path</text>
  <line x1="58" y1="506" x2="94" y2="506" stroke="#94A3B8" stroke-width="1.2" stroke-dasharray="1.5 3.5"/>
  <text x="104" y="510" font-size="10.5" fill="#475569">metadata only</text>
  <text x="58" y="536" font-size="10" fill="#94A3B8">Every store is a real service.</text>

  <!-- ============ APPLICATION BOUNDARY ============ -->
  <rect x="350" y="120" width="650" height="520" rx="14" fill="#F0FDFA" stroke="#5EEAD4" stroke-width="1.4"/>
  <text x="370" y="146" font-size="10.5" font-weight="700" fill="#0D9488" letter-spacing="1.4">APPLICATION BOUNDARY</text>
  <text x="757" y="146" font-size="10.5" fill="#5E8C86">FastAPI modular monolith &#183; two worker processes</text>

  <g filter="url(#sh)">
    <rect x="378" y="180" width="200" height="76" rx="10" fill="#FFFFFF" stroke="#0D9488" stroke-width="1.5"/>
    <text x="394" y="207" font-size="13.5" font-weight="600" fill="#0F172A">HTTP API</text>
    <text x="394" y="226" font-size="10.5" fill="#64748B">FastAPI &#183; :8000</text>
  </g>
  <g filter="url(#sh)">
    <rect x="650" y="180" width="320" height="76" rx="10" fill="#FFFFFF" stroke="#5EEAD4" stroke-width="1.2"/>
    <text x="666" y="207" font-size="13.5" font-weight="600" fill="#0F172A">Authentication</text>
    <text x="666" y="226" font-size="10.5" fill="#64748B">role checks &#183; request validation</text>
  </g>
  <g filter="url(#sh)">
    <rect x="650" y="300" width="320" height="104" rx="10" fill="#FFFFFF" stroke="#5EEAD4" stroke-width="1.2"/>
    <text x="666" y="327" font-size="13.5" font-weight="600" fill="#0F172A">Academic workflows</text>
    <text x="666" y="347" font-size="10.5" fill="#64748B">courses &#183; offerings &#183; enrollment</text>
    <text x="666" y="364" font-size="10.5" fill="#64748B">grades &#183; attendance &#183; timetable</text>
  </g>
  <g filter="url(#sh)">
    <rect x="378" y="440" width="592" height="160" rx="10" fill="#FFFFFF" stroke="#F59E0B" stroke-width="1.3"/>
    <text x="394" y="467" font-size="13.5" font-weight="600" fill="#0F172A">Shared-state experiments</text>
    <text x="394" y="488" font-size="10.5" fill="#64748B">rate limiting &#183; autocomplete cache &#183; unique IDs</text>
    <text x="394" y="505" font-size="10.5" fill="#64748B">hashed shard writes &#183; resumable crawl</text>
    <text x="394" y="530" font-size="10" fill="#94A3B8">each facility needs its store present: nothing is emulated in-process</text>
    <text x="394" y="547" font-size="10" fill="#94A3B8">shared by both workers, so one allowance and one cache between them</text>
  </g>

  <!-- intra-app edges -->
  <line x1="578" y1="218" x2="650" y2="218" stroke="#94A3B8" stroke-width="1.4" marker-end="url(#ar-slate)"/>
  <text x="598" y="210" font-size="10" fill="#64748B">authorize</text>
  <line x1="810" y1="256" x2="810" y2="300" stroke="#94A3B8" stroke-width="1.4" marker-end="url(#ar-slate)"/>
  <text x="822" y="282" font-size="10" fill="#64748B">allowed request</text>
  <line x1="470" y1="256" x2="470" y2="440" stroke="#94A3B8" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#ar-slate)"/>
  <text x="482" y="356" font-size="10" fill="#64748B">experimental routes</text>
  <line x1="740" y1="404" x2="740" y2="440" stroke="#94A3B8" stroke-width="1.4" marker-end="url(#ar-slate)"/>
  <text x="752" y="428" font-size="10" fill="#64748B">uses shared components</text>

  <!-- clients -> api -->
  <line x1="272" y1="212" x2="378" y2="216" stroke="#94A3B8" stroke-width="1.4" marker-end="url(#ar-slate)"/>
  <text x="278" y="204" font-size="10" fill="#64748B">HTTPS / JSON</text>
  <line x1="272" y1="290" x2="378" y2="242" stroke="#94A3B8" stroke-width="1.4" marker-end="url(#ar-slate)"/>
  <text x="278" y="286" font-size="10" fill="#64748B">HTTP workload</text>

  <!-- ============ POSTGRESQL ============ -->
  <g filter="url(#sh)">
    <rect x="1060" y="180" width="360" height="104" rx="10" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
    <text x="1076" y="208" font-size="13.5" font-weight="600" fill="#0F172A">PostgreSQL</text>
    <text x="1076" y="228" font-size="10.5" fill="#92400E">authoritative academic state</text>
    <text x="1076" y="245" font-size="10.5" fill="#92400E">constraints &#183; transactions</text>
  </g>
  <line x1="970" y1="352" x2="1060" y2="234" stroke="#B45309" stroke-width="1.7" marker-end="url(#ar-amber)"/>
  <text x="1012" y="300" font-size="10" fill="#B45309">SQL transaction</text>

  <!-- ============ REDIS ============ -->
  <rect x="1020" y="430" width="400" height="238" rx="14" fill="#FFF1F2" stroke="#FDA4AF" stroke-width="1.4"/>
  <text x="1040" y="456" font-size="10.5" font-weight="700" fill="#E11D48" letter-spacing="1.4">REDIS 7</text>
  <text x="1105" y="456" font-size="10.5" fill="#9F5A68">:6379 &#183; shared by both workers</text>

  <g filter="url(#sh)">
    <rect x="1040" y="470" width="360" height="54" rx="9" fill="#FFFFFF" stroke="#F43F5E" stroke-width="1.2"/>
    <text x="1056" y="492" font-size="12.5" font-weight="600" fill="#0F172A">Token buckets</text>
    <text x="1056" y="509" font-size="10" fill="#64748B">one atomic Lua read-modify-write</text>
  </g>
  <g filter="url(#sh)">
    <rect x="1040" y="534" width="360" height="54" rx="9" fill="#FFFFFF" stroke="#F43F5E" stroke-width="1.2"/>
    <text x="1056" y="556" font-size="12.5" font-weight="600" fill="#0F172A">TTL cache</text>
    <text x="1056" y="573" font-size="10" fill="#64748B">autocomplete &#183; SETEX &#183; expires in place</text>
  </g>
  <g filter="url(#sh)">
    <rect x="1040" y="598" width="360" height="54" rx="9" fill="#FFFFFF" stroke="#F43F5E" stroke-width="1.2"/>
    <text x="1056" y="620" font-size="12.5" font-weight="600" fill="#0F172A">ID worker slots</text>
    <text x="1056" y="637" font-size="10" fill="#64748B">INCR &#8594; slot 1 or 2 &#183; 1,000 unique IDs</text>
  </g>

  <line x1="970" y1="472" x2="1040" y2="497" stroke="#F43F5E" stroke-width="1.4" marker-end="url(#ar-rose)"/>
  <line x1="970" y1="524" x2="1040" y2="561" stroke="#F43F5E" stroke-width="1.4" marker-end="url(#ar-rose)"/>
  <line x1="970" y1="576" x2="1040" y2="625" stroke="#F43F5E" stroke-width="1.4" marker-end="url(#ar-rose)"/>

  <!-- ============ MONGODB ============ -->
  <rect x="1020" y="690" width="400" height="270" rx="14" fill="#EEF2FF" stroke="#A5B4FC" stroke-width="1.4"/>
  <text x="1040" y="716" font-size="10.5" font-weight="700" fill="#4338CA" letter-spacing="1.4">MONGODB 7</text>
  <text x="1145" y="716" font-size="10.5" fill="#6B6FA8">sharded cluster &#183; hashed _id</text>

  <g filter="url(#sh)">
    <rect x="1040" y="730" width="150" height="66" rx="9" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
    <text x="1054" y="756" font-size="12.5" font-weight="600" fill="#0F172A">mongos</text>
    <text x="1054" y="773" font-size="10" fill="#64748B">router &#183; :27017</text>
  </g>
  <g filter="url(#sh)">
    <rect x="1230" y="730" width="170" height="66" rx="9" fill="#FFFFFF" stroke="#818CF8" stroke-width="1.2"/>
    <text x="1244" y="756" font-size="12.5" font-weight="600" fill="#0F172A">Crawl frontier</text>
    <text x="1244" y="773" font-size="10" fill="#64748B">collections &#183; resume state</text>
  </g>
  <line x1="1190" y1="763" x2="1230" y2="763" stroke="#818CF8" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#ar-indigo)"/>

  <g filter="url(#sh)">
    <rect x="1040" y="822" width="110" height="68" rx="9" fill="#FFFFFF" stroke="#A5B4FC" stroke-width="1.2"/>
    <text x="1052" y="846" font-size="11.5" font-weight="600" fill="#0F172A">config server</text>
    <text x="1052" y="862" font-size="10" fill="#64748B">chunk map</text>
    <text x="1052" y="877" font-size="10" fill="#94A3B8">:27019</text>
  </g>
  <g filter="url(#sh)">
    <rect x="1165" y="822" width="110" height="68" rx="9" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.4"/>
    <text x="1177" y="846" font-size="11.5" font-weight="600" fill="#0F172A">shard A</text>
    <text x="1177" y="862" font-size="10" fill="#64748B">replica set</text>
    <text x="1177" y="877" font-size="10" fill="#94A3B8">:27021</text>
  </g>
  <g filter="url(#sh)">
    <rect x="1290" y="822" width="110" height="68" rx="9" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.4"/>
    <text x="1302" y="846" font-size="11.5" font-weight="600" fill="#0F172A">shard B</text>
    <text x="1302" y="862" font-size="10" fill="#64748B">replica set</text>
    <text x="1302" y="877" font-size="10" fill="#94A3B8">:27022</text>
  </g>

  <line x1="1108" y1="796" x2="1096" y2="822" stroke="#A5B4FC" stroke-width="1.2" stroke-dasharray="1.5 3.5"/>
  <line x1="1150" y1="796" x2="1220" y2="822" stroke="#4F46E5" stroke-width="1.4" marker-end="url(#ar-indigo)"/>
  <line x1="1178" y1="796" x2="1345" y2="822" stroke="#4F46E5" stroke-width="1.4" marker-end="url(#ar-indigo)"/>

  <!-- app -> mongos -->
  <line x1="970" y1="586" x2="1040" y2="758" stroke="#4F46E5" stroke-width="1.5" marker-end="url(#ar-indigo)"/>
  <text x="1008" y="664" font-size="10" fill="#4338CA">hashed shard writes</text>

  <!-- ============ STARTUP GUARD ============ -->
  <rect x="350" y="680" width="650" height="96" rx="12" fill="#FFFBEB" stroke="#F59E0B" stroke-width="1.2"/>
  <text x="370" y="710" font-size="12.5" font-weight="700" fill="#78350F">Startup guard &#8212; the honest failure mode</text>
  <text x="370" y="731" font-size="10.5" fill="#92400E">Redis or MongoDB unreachable &#8594; the app refuses to start; there is no in-memory stand-in.</text>
  <text x="370" y="749" font-size="10.5" fill="#92400E">If a store drops after boot, the affected data routes answer HTTP 503 instead of guessing.</text>

  <!-- evidence line -->
  <text x="44" y="996" font-size="10" fill="#94A3B8">Measured on this stack: 500 sharded keys split 249 / 251 &#183; moveChunk moved it to 129 / 371 with all 500 keys still readable &#183; rebalance 256 / 244 &#183; 1,000 unique IDs across worker slots 1 and 2.</text>
</svg>
